name: Build notPipe-BB10 APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Android SDK 25 (platform, build-tools, platform-tools)
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK"
          MGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$MGR" --sdk_root="$SDK" --licenses > /dev/null || true
          "$MGR" --sdk_root="$SDK" "platforms;android-25" "build-tools;25.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Create temporary signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          APK="$(find app/build/outputs/apk -name '*.apk' ! -name '*unaligned*' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/notPipe-BB10.apk

      - uses: actions/upload-artifact@v4
        with:
          name: notPipe-BB10
          path: dist/notPipe-BB10.apk
          if-no-files-found: error
